[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyredis-engine"
version = "0.0.1"
description = "Educational Redis-compatible database server with RESP2 and partial RESP3 support"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PyRedis Engine contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "hypothesis>=6,<7",
  "redis>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2"
]

[project.scripts]
pyredis-engine = "pyredis_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: socket-level integration tests", "differential: requires external Redis server", "slow: extended fault and soak tests", "persistence: disk recovery tests", "replication: primary-replica tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pyredis_engine"]
